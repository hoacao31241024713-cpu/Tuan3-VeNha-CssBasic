<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bài tập 4 – Menu ngang | Bài tập CSS</title>
    <link rel="stylesheet" href="assets/common.css">
    <style>
        .menu-demo {
            display: flex;
            justify-content: center;
            padding: 55px 10px
        }

        .class-menu {
            list-style: none;
            margin: 0;
            padding: 0;
            text-align: center
        }

        .class-menu li {
            display: inline-block;
            background: #00f4f6;
            width: 120px;
            margin: 4px 2px
        }

        .class-menu li a {
            display: block;
            font: 26px 'Times New Roman', serif;
            color: blue;
            text-decoration: underline;
            line-height: 32px
        }

        .class-menu li:hover {
            background: #98ffff
        }

        @media(max-width:600px) {
            .class-menu li {
                width: 90px
            }

            .class-menu li a {
                font-size: 21px
            }
        }
    </style>
</head>
