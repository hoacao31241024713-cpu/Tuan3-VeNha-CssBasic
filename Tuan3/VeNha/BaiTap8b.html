<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bài tập 8b – The Bat Family</title>
    <link rel="stylesheet" href="assets/common.css">
    <style>
        #root {
            width: min(1024px, calc(100% - 32px));
            margin: 42px auto 90px;
            text-align: center;
            font-family: Georgia, "Times New Roman", serif
        }

        #site-header {
            margin: 0 0 30px;
            background: #c9c9c9;
            color: #fff;
            padding: 13px 0;
            font-size: 28px;
            text-shadow: 2px 2px 2px #4b4b4b
        }

        #site-header:before {
            content: "";
            display: inline-block;
            width: 46px;
            height: 24px;
            margin: 0 15px 0 0;
            vertical-align: middle;
            background: url('assets/logo.png') center/contain no-repeat
        }

        .superheroes {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            list-style: none;
            gap: 6px;
            padding: 0 25px;
            margin: 0
        }

        .superheroes li {
            position: relative;
            width: 20%;
            min-width: 0;
            transition: width .3s ease;
            flex-shrink: 1
        }

        .superheroes li:hover,
        .superheroes li:focus-within {
            width: 28%
        }

        .superheroes img {
            display: block;
            width: 100%;
            max-width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 19px;
            border: 2px solid #dedede
        }

        .hero-header {
            position: absolute;
            z-index: 2;
            top: 9px;
            left: 0;
            right: 0;
            color: #fff;
            text-shadow: 0 1px 5px #111;
            font-size: 15px
        }

        .superheroes a {
            display: none;
            width: 100%;
            padding: 7px;
            color: white;
            background: #858585;
            text-decoration: none;
            font-size: 15px
        }

        .superheroes li:hover a,
        .superheroes li:focus-within a {
            display: block;
            text-decoration: underline
        }

        @media(max-width:720px) {
            .superheroes {
                flex-wrap: wrap;
                padding: 0 8px
            }

            .superheroes li {
                width: 30%
            }

            .superheroes li:hover,
            .superheroes li:focus-within {
                width: 38%
            }
        }

        @media(max-width:460px) {
            .superheroes li {
                width: 46%
            }

            .superheroes li:hover,
            .superheroes li:focus-within {
                width: 50%
            }

            .superheroes img {
                height: 160px
            }
        }
    </style>
</head>

<body>
    <nav class="top-nav"><a class="brand" href="../index.html">HOA</a><a href="../index.html">← Trang
            danh sách bài tập</a></nav>
    <main class="wrap"><span class="eyebrow">Bài tập 8b</span>
    <div id="root">
        <h1 id="site-header"><span>The Bat family</span></h1>
        <ul class="superheroes">
            <li>
                <strong class="hero-header">Batman</strong>
                <img src="assets/superhero-1.jpg" alt="Nhân vật Bat Family">
                <a href="https://en.wikipedia.org/wiki/Batman">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Batwing</strong>
                <img src="assets/superhero-2.jpg" alt="Nhân vật Bat Family">
                <a href="https://en.wikipedia.org/wiki/Batwing_(DC_Comics)">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Batgirl</strong>
                <img src="assets/superhero-3.jpg" alt="Nhân vật Bat Family">
                <a href="https://en.wikipedia.org/wiki/Batgirl">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Nightwing</strong>
                <img src="assets/superhero-4.jpg" alt="Nhân vật Bat Family">
                <a href="https://en.wikipedia.org/wiki/Nightwing">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Red Robin</strong>
                <img src="assets/superhero-5.jpg" alt="Nhân vật Bat Family">
                <a href="https://en.wikipedia.org/wiki/Red_Robin_(comics)">Read more</a>
            </li>
        </ul>
    </div>
    <footer class="site-footer">Tuần 3 - Bài tập 8b <a href="../index.html">Về trang chủ</a></footer>
</body>

</html>
