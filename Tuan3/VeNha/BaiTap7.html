<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bài tập 7 – Layout cơ bản | Bài tập CSS</title>
    <link rel="stylesheet" href="assets/common.css">
    <style>
        .layout-outside {
            display: flex;
            justify-content: center;
            padding: 30px
        }

        .layout-outside #wrapper {
            width: 440px;
            max-width: 100%;
            border: 3px solid #111;
            padding: 7px;
            box-shadow: -14px 15px 20px #0003;
            font: 20px Arial, sans-serif;
            color: #111
        }

        .layout-outside header,
        .layout-outside nav,
        .layout-outside main,
        .layout-outside footer {
            border: 3px solid #111;
            padding: 10px
        }

        .layout-outside header {
            height: 86px;
            margin-bottom: 8px
        }

        .layout-outside .middle {
            display: grid;
            grid-template-columns: 82px minmax(0, 1fr);
            gap: 8px;
            margin-bottom: 8px
        }

        .layout-outside nav,
        .layout-outside main {
            height: 330px
        }

        .layout-outside footer {
            height: 58px
        }
    </style>
</head>

<body>
    <nav class="top-nav"><a class="brand" href="../../index.html">HOA</a><a href="../../index.html">← Trang
            danh sách bài tập</a></nav>
    <main class="wrap"><span class="eyebrow">Bài tập 7</span>
        <h1 class="page-title">Dàn trang bằng HTML semantic</h1>
        <div class="layout-outside">
            <div id="wrapper">
                <header>header</header>
                <div class="middle">
                    <nav>nav</nav>
                    <main>main</main>
                </div>
                <footer>footer</footer>
            </div>
        </div>
    </main>
    <footer class="site-footer">Phát triển ứng dụng TMĐT - Tuần 3 - Bài tập CSS <a href="../../index.html">Về trang
            chủ</a></footer>
</body>

</html>
